# Optional ValidatingWebhookConfiguration for Machine admission.
# Requires controller --webhook-addr=:9443 and a TLS Service/Certificate (cert-manager or manual).
apiVersion: v1
kind: Service
metadata:
  name: kairon-webhook
  namespace: kairon-system
spec:
  selector:
    app.kubernetes.io/name: kairon-controller
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kairon-machine-validate
webhooks:
  - name: machines.kairon.zyvor.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: kairon-webhook
        namespace: kairon-system
        path: /validate
      # caBundle must be filled with the serving cert CA (base64).
      caBundle: ""
    rules:
      - apiGroups: ["kairon.zyvor.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["machines"]
