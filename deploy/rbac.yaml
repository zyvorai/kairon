apiVersion: v1
kind: Namespace
metadata:
  name: kairon-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-controller
  namespace: kairon-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-node
  namespace: kairon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kairon-controller
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machineimages", "virtualdisks", "machinesnapshots"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines/status", "machineimages/status", "virtualdisks/status", "machinesnapshots/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kairon-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kairon-controller
subjects:
  - kind: ServiceAccount
    name: kairon-controller
    namespace: kairon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kairon-node
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machineimages", "virtualdisks", "machinesnapshots"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines/status", "machineimages/status", "virtualdisks/status", "machinesnapshots/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kairon-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kairon-node
subjects:
  - kind: ServiceAccount
    name: kairon-node
    namespace: kairon-system
