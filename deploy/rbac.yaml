apiVersion: v1
kind: Namespace
metadata:
  name: kairon-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-controller
  namespace: kairon-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-node
  namespace: kairon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kairon-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machines/status", "machinemigrations", "machinemigrations/status", "machinesnapshots", "machinesnapshots/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kairon-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kairon-controller
subjects:
  - kind: ServiceAccount
    name: kairon-controller
    namespace: kairon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kairon-node
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machines/status", "machinemigrations", "machinemigrations/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kairon-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kairon-node
subjects:
  - kind: ServiceAccount
    name: kairon-node
    namespace: kairon-system
