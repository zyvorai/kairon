apiVersion: v1
kind: Namespace
metadata:
  name: kairon-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-controller
  namespace: kairon-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-node
  namespace: kairon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kairon-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machines/status", "machinemigrations", "machinemigrations/status", "machinesnapshots", "machinesnapshots/status", "machinenetworkpolicies", "machinenetworkpolicies/status", "networksecuritygroups", "networksecuritygroups/status", "machinequotas", "machinequotas/status", "machinesnapshotrestores", "machinesnapshotrestores/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    # Read-only on the spec: the admission webhook and kaironctl evacuate
    # both only ever list these to evaluate a MachineMigration create
    # against; kairon-controller never writes spec.
    resources: ["machinedisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kairon.zyvor.dev"]
    # Separate rule, /status only: kairon-controller reconciles real
    # status (expectedMachines/currentHealthy/desiredHealthy/
    # disruptionsAllowed) every tick.
    resources: ["machinedisruptionbudgets/status"]
    verbs: ["patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create"]
  - apiGroups: ["resource.k8s.io"]
    # Read-only: backs the scheduler's DRA topology-awareness hint (see
    # internal/controller/dra.go's buildDRAHints).
    resources: ["resourceclaims", "resourceslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kairon-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kairon-controller
subjects:
  - kind: ServiceAccount
    name: kairon-controller
    namespace: kairon-system
---
# Only needed if kairon-controller is started with -leader-elect=true (off
# by default -- see cmd/kairon-controller/main.go and
# internal/leaderelection). Namespaced, not cluster-wide: leader election
# only ever touches one Lease in kairon-controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kairon-controller-leader-election
  namespace: kairon-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kairon-controller-leader-election
  namespace: kairon-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kairon-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: kairon-controller
    namespace: kairon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kairon-node
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machines/status", "machinemigrations", "machinemigrations/status", "machinenetworkpolicies", "machinenetworkpolicies/status", "networksecuritygroups", "networksecuritygroups/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kairon-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kairon-node
subjects:
  - kind: ServiceAccount
    name: kairon-node
    namespace: kairon-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-ui
  namespace: kairon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kairon-ui
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machinemigrations"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machinesnapshots"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kairon-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kairon-ui
subjects:
  - kind: ServiceAccount
    name: kairon-ui
    namespace: kairon-system
