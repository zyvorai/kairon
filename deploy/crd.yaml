apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machines.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machines
    singular: machine
    kind: Machine
    shortNames:
    - km
    - kvmachine
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Node
      type: string
      jsonPath: .spec.nodeName
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: CPU
      type: string
      jsonPath: .spec.resources.cpu
    - name: Memory
      type: string
      jsonPath: .spec.resources.memory
    - name: IP
      type: string
      jsonPath: .status.guestIP
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - image
            - resources
            properties:
              nodeName:
                type: string
              image:
                type: object
                required:
                - path
                properties:
                  path:
                    type: string
                    minLength: 1
                  digest:
                    type: string
              resources:
                type: object
                required:
                - cpu
                - memory
                properties:
                  cpu:
                    type: string
                    minLength: 1
                  memory:
                    type: string
                    minLength: 1
              runtime:
                type: object
                properties:
                  backend:
                    type: string
                    enum:
                    - auto
                    - qemu
                    - cloud-hypervisor
                    - firecracker
                    - flux-vm
                    default: auto
                  kernel:
                    type: string
              network:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - user
                    - tap
                    - macvtap
                    default: user
                  netns:
                    type: boolean
                    default: false
                  bridge:
                    type: string
                  parent:
                    type: string
                  mac:
                    type: string
                  tapName:
                    type: string
                  macvtapMode:
                    type: string
                    enum:
                    - bridge
                    - vepa
                    - private
                    - passthru
                  forwards:
                    type: array
                    items:
                      type: object
                      required:
                      - hostPort
                      - guestPort
                      properties:
                        hostPort:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        guestPort:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        protocol:
                          type: string
                          enum:
                          - tcp
                          - udp
                          default: tcp
                  staticNetwork:
                    type: boolean
                    default: false
                  podUID:
                    type: string
                  dataplaneRequired:
                    type: boolean
                    default: false
              powerState:
                type: string
                enum:
                - Running
                - Stopped
                default: Running
              tenant:
                type: string
              ttlSeconds:
                type: integer
                format: int64
                minimum: 0
              placement:
                type: object
                properties:
                  architecture:
                    type: string
                  nodeSelector:
                    type: object
                    additionalProperties:
                      type: string
              security:
                type: object
                properties:
                  secureBoot:
                    type: boolean
                  tpm:
                    type: boolean
              volumes:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - claimName
                  properties:
                    name:
                      type: string
                      minLength: 1
                    claimName:
                      type: string
                      minLength: 1
              deviceClaims:
                type: array
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      minLength: 1
              serviceFabric:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - port
                      properties:
                        name:
                          type: string
                          minLength: 1
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        weight:
                          type: integer
                          minimum: 1
                          maximum: 65535
          status:
            type: object
            properties:
              phase:
                type: string
              nodeName:
                type: string
              runtimeID:
                type: string
              guestIP:
                type: string
              observedGeneration:
                type: integer
                format: int64
              message:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              network:
                type: object
                properties:
                  guestIP:
                    type: string
                  tapName:
                    type: string
                  dataplane:
                    type: object
                    properties:
                      attached:
                        type: boolean
                      mode:
                        type: string
                      schemaVersion:
                        type: integer
                      identity:
                        type: integer
                      policyFingerprint:
                        type: string
                      policySynced:
                        type: boolean
                      interface:
                        type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinemigrations.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinemigrations
    singular: machinemigration
    kind: MachineMigration
    shortNames:
    - kmm
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Machine
      type: string
      jsonPath: .spec.machineName
    - name: Strategy
      type: string
      jsonPath: .status.effectiveStrategy
    - name: Source
      type: string
      jsonPath: .status.sourceNode
    - name: Target
      type: string
      jsonPath: .status.targetNode
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - machineName
            properties:
              machineName:
                type: string
                minLength: 1
              strategy:
                type: string
                enum:
                - auto
                - live
                - cold
                default: auto
              targetNode:
                type: string
                description: Target Kubernetes node. Live migration target preparation
                  is negotiated automatically over the Kairon mTLS peer API.
              mode:
                type: string
                enum:
                - pre-copy
                - post-copy
                default: pre-copy
              bandwidthMbps:
                type: integer
                format: int64
                minimum: 0
              maxDowntimeMs:
                type: integer
                format: int64
                minimum: 0
              multifdChannels:
                type: integer
                minimum: 0
                maximum: 255
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              sourceNode:
                type: string
              targetNode:
                type: string
              effectiveStrategy:
                type: string
              runtimeID:
                type: string
              ramTransferred:
                type: integer
                format: int64
                minimum: 0
              ramRemaining:
                type: integer
                format: int64
                minimum: 0
              ramTotal:
                type: integer
                format: int64
                minimum: 0
              totalTimeMs:
                type: integer
                format: int64
                minimum: 0
              downtimeMs:
                type: integer
                format: int64
                minimum: 0
              sessionID:
                type: string
                description: Opaque Kairon peer session identifier; never contains
                  credentials.
              transferID:
                type: string
                description: Opaque source-adapter transfer identifier.
              transferPhase:
                type: string
                description: Source migration adapter phase.
              backend:
                type: string
                description: Migration adapter backend selected by the target node.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinesnapshots.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinesnapshots
    singular: machinesnapshot
    kind: MachineSnapshot
    shortNames:
    - kms
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Machine
      type: string
      jsonPath: .spec.machineName
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Ready
      type: boolean
      jsonPath: .status.readyToUse
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - machineName
            properties:
              machineName:
                type: string
                minLength: 1
              volumeSnapshotClassName:
                type: string
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              readyToUse:
                type: boolean
              volumeSnapshots:
                type: array
                items:
                  type: object
                  required:
                  - volumeName
                  - volumeSnapshotName
                  properties:
                    volumeName:
                      type: string
                    volumeSnapshotName:
                      type: string
                    readyToUse:
                      type: boolean
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinenetworkpolicies.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinenetworkpolicies
    singular: machinenetworkpolicy
    kind: MachineNetworkPolicy
    shortNames:
    - kmnp
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Machine
      type: string
      jsonPath: .spec.machineName
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - policy
            properties:
              machineName:
                type: string
              selector:
                type: object
                additionalProperties:
                  type: string
              policy:
                type: object
                properties:
                  defaultAllow:
                    type: boolean
                  allowCidrs:
                    type: array
                    items:
                      type: string
                  denyCidrs:
                    type: array
                    items:
                      type: string
                  allowPorts:
                    type: array
                    items:
                      type: string
                  maxEgressMbps:
                    type: integer
                    minimum: 0
                  maxEgressPps:
                    type: integer
                    minimum: 0
                  allowFqdns:
                    type: array
                    items:
                      type: string
                  groups:
                    type: array
                    items:
                      type: string
                  labels:
                    type: array
                    items:
                      type: string
                  entities:
                    type: array
                    items:
                      type: string
                  auditMode:
                    type: boolean
                  allowIcmp:
                    type: boolean
                  sampleRate:
                    type: integer
                    minimum: 0
              cnp:
                type: object
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              observedMachines:
                type: integer
              lastAppliedTime:
                type: string
                format: date-time
              effectiveSynced:
                type: boolean
---
