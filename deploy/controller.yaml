apiVersion: apps/v1
kind: Deployment
metadata:
  name: kairon-controller
  namespace: kairon-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kairon-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kairon-controller}
    spec:
      serviceAccountName: kairon-controller
      containers:
        - name: controller
          image: ghcr.io/zyvorai/kairon-controller:latest
          imagePullPolicy: IfNotPresent
          args: ["--interval=5s", "--require-capable-label=true", "--fence-grace=60s"]
          ports:
            - {name: health, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
