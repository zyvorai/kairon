---
apiVersion: kairon.zyvor.dev/v1
kind: Machine
metadata:
  name: acme-web
  namespace: lab
  annotations:
    kairon.zyvor.dev/tenant-fence: "true"
spec:
  tenant: acme
  image:
    path: /var/lib/fluxvm/images/acme-web.qcow2
  resources:
    cpu: "2"
    memory: 2Gi
  network:
    dataplaneMode: ebpf
---
apiVersion: kairon.zyvor.dev/v1
kind: Machine
metadata:
  name: globex-web
  namespace: lab
  annotations:
    kairon.zyvor.dev/tenant-fence: "true"
spec:
  tenant: globex
  image:
    path: /var/lib/fluxvm/images/globex-web.qcow2
  resources:
    cpu: "2"
    memory: 2Gi
  network:
    dataplaneMode: ebpf
