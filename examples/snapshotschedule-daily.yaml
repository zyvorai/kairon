# Snapshot every Machine labelled tier=web in this namespace once a day at
# 02:30 UTC, spread over a fixed 30-minute window per schedule, keeping the
# last 14 snapshots per Machine and dropping any older than 7 days (the
# newest ready snapshot of each Machine is always kept).
# dailyAt and intervalSeconds are mutually exclusive; selector is required.
# See docs/guides/machine-snapshot-schedules.md.
apiVersion: kairon.zyvor.dev/v1
kind: MachineSnapshotSchedule
metadata:
  name: web-daily
  namespace: default
spec:
  selector:
    tier: web
  dailyAt: "02:30"
  jitterSeconds: 1800
  keepLast: 14
  maxAgeSeconds: 604800
