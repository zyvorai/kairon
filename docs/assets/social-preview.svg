<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Kairon — Real VMs on Kubernetes without KubeVirt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#2997ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="200" cy="200" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="96" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1d1d1f" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280"/>
    <path d="M320 0 V640 M640 0 V640 M960 0 V640"/>
  </g>

  <!-- brand mark -->
  <rect x="96" y="112" width="104" height="104" rx="24" fill="url(#mark)"/>
  <path d="M126 136 176 136 126 196 176 196" fill="none" stroke="#ffffff"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="96" y="318" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="108" font-weight="700" fill="#1d1d1f" letter-spacing="-2">Kairon</text>

  <rect x="96" y="342" width="220" height="3" fill="url(#hair)"/>

  <!-- tagline -->
  <text x="96" y="392" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif"
        font-size="28" font-weight="400" fill="#6e6e73">Real VMs on Kubernetes — without KubeVirt</text>

  <!-- chips: one row -->
  <g font-family="'SF Mono','Menlo',monospace" font-size="18" font-weight="600" fill="#0066cc">
    <rect x="96" y="448" width="228" height="44" rx="22" fill="#e8f2fd" stroke="#b9d7f7"/>
    <text x="120" y="476">No virt-launcher</text>

    <rect x="340" y="448" width="168" height="44" rx="22" fill="#e8f2fd" stroke="#b9d7f7"/>
    <text x="364" y="476">Go stdlib</text>

    <rect x="524" y="448" width="168" height="44" rx="22" fill="#e8f2fd" stroke="#b9d7f7"/>
    <text x="548" y="476">Live migrate</text>

    <rect x="708" y="448" width="196" height="44" rx="22" fill="#e8f2fd" stroke="#b9d7f7"/>
    <text x="732" y="476">NeedsRecovery</text>
  </g>

  <text x="96" y="560" font-family="'SF Mono','Menlo',monospace" font-size="16" fill="#6e6e73">Apache-2.0 · FluxVM · KVM</text>

  <!-- architecture motif -->
  <g>
    <rect x="860" y="120" width="300" height="72" rx="14" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="1010" y="152" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="15" font-weight="600" fill="#1d1d1f">Kubernetes API</text>
    <text x="1010" y="174" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#6e6e73">Machine · Migration · Snapshot</text>

    <path d="M1010 192 V226" stroke="#0071e3" stroke-opacity="0.55" stroke-width="2" fill="none"/>
    <path d="M910 226 H1110" stroke="#0071e3" stroke-opacity="0.55" stroke-width="2" fill="none"/>
    <path d="M910 226 V252 M1110 226 V252" stroke="#0071e3" stroke-opacity="0.55" stroke-width="2" fill="none"/>

    <rect x="820" y="252" width="180" height="56" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="910" y="286" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="14" font-weight="600" fill="#1d1d1f">kairon-controller</text>

    <rect x="1020" y="252" width="180" height="56" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="1110" y="286" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="14" font-weight="600" fill="#1d1d1f">kairon-node</text>

    <path d="M1110 308 V340" stroke="#0071e3" stroke-opacity="0.55" stroke-width="2" fill="none"/>
    <rect x="1000" y="340" width="220" height="48" rx="12" fill="#e8f2fd" stroke="#0071e3" stroke-opacity="0.6"/>
    <text x="1110" y="370" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="14" font-weight="600" fill="#0066cc">FluxVM · KVM</text>
    <circle cx="1210" cy="350" r="5" fill="#ff6a2a"/>
  </g>

  <text x="1184" y="560" text-anchor="end" font-family="'SF Mono','Menlo',monospace" font-size="15" fill="#6e6e73">github.com/zyvorai/kairon</text>
  <text x="1184" y="592" text-anchor="end" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="600" fill="#0071e3">zyvor.dev</text>
</svg>
