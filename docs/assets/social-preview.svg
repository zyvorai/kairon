<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Kairon — Kubernetes-native VMs without KubeVirt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a15"/>
      <stop offset="1" stop-color="#cc420a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- brand mark -->
  <rect x="96" y="96" width="120" height="120" rx="28" fill="url(#mark)"/>
  <path d="M131 122 189 122 131 194 189 194" fill="none" stroke="#ffffff"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="94" y="330" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="96" font-weight="700" fill="#f5f5f5">Kairon</text>

  <!-- tagline -->
  <text x="96" y="392" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif"
        font-size="34" font-weight="400" fill="#b8b8bc">Kubernetes-native VMs — without KubeVirt</text>
  <text x="96" y="432" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif"
        font-size="24" font-weight="400" fill="#87878d">Kubernetes declares. Kairon orchestrates. FluxVM executes.</text>

  <!-- chips -->
  <g font-family="'SF Mono','Menlo',monospace" font-size="22" font-weight="600" fill="#e8e8ea">
    <rect x="96" y="472" width="300" height="52" rx="26" fill="#1f1f22" stroke="#33333a"/>
    <text x="128" y="506">No virt-launcher Pod</text>

    <rect x="412" y="472" width="252" height="52" rx="26" fill="#1f1f22" stroke="#33333a"/>
    <text x="444" y="506">Go stdlib only</text>

    <rect x="680" y="472" width="176" height="52" rx="26" fill="#1f1f22" stroke="#33333a"/>
    <text x="712" y="506">Apache-2.0</text>

    <rect x="872" y="472" width="120" height="52" rx="26" fill="#1f1f22" stroke="#33333a"/>
    <text x="904" y="506">Helm</text>
  </g>

  <!-- footer -->
  <text x="1184" y="588" text-anchor="end" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif"
        font-size="24" font-weight="600" fill="#ff5a15">zyvor.dev</text>
  <text x="1184" y="558" text-anchor="end" font-family="'SF Mono','Menlo',monospace"
        font-size="18" fill="#6c6c72">github.com/zyvorai/kairon</text>
</svg>
