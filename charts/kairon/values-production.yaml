# Production installation profile for Kairon.
# Usage:
#   helm install kairon charts/kairon -n kairon-system --create-namespace \
#     -f charts/kairon/values-production.yaml
#
# Evaluation installs should keep charts/kairon/values.yaml defaults
# (webhook and multi-tenant hardening off) so demos keep working.

webhook:
  enabled: true

controller:
  image:
    tag: "" # Chart.AppVersion

node:
  image:
    tag: ""
  networkDefaultDeny: true
  interval: 5m

ui:
  image:
    tag: ""
  auth:
    namespaceScoping:
      enabled: true

csiNode:
  image:
    tag: ""

csiController:
  image:
    tag: ""

migration:
  enabled: true
  # Require a real per-node dataplane identity in production rather than
  # falling back to the shared control-plane cert.
  dataplaneTls: true
  # Operator must set dataplaneTlsSecretName to a Secret produced by
  # scripts/gen-migration-mtls-certs.sh (or equivalent).
  # dataplaneTlsSecretName: kairon-migration-dataplane

# Prefer digest pins in locked-down environments by overriding:
#   controller.image.tag: "0.6.0@sha256:..."
