apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-controller
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairon-node
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-controller}
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machines/status", "machineimages", "machineimages/status", "virtualdisks", "virtualdisks/status", "machinesnapshots", "machinesnapshots/status", "machinedisruptionbudgets", "machinedisruptionbudgets/status", "machinemigrations", "machinemigrations/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kairon-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kairon-controller}
subjects:
  - {kind: ServiceAccount, name: kairon-controller, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-node}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["kairon.zyvor.dev"]
    resources: ["machines", "machines/status", "machineimages", "machineimages/status", "virtualdisks", "virtualdisks/status", "machinesnapshots", "machinesnapshots/status", "machinedisruptionbudgets", "machinedisruptionbudgets/status", "machinemigrations", "machinemigrations/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kairon-node}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kairon-node}
subjects:
  - {kind: ServiceAccount, name: kairon-node, namespace: {{ .Release.Namespace }}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kairon-controller, namespace: {{ .Release.Namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kairon-controller}}
  template:
    metadata: {labels: {app.kubernetes.io/name: kairon-controller}}
    spec:
      serviceAccountName: kairon-controller
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args: ["--interval={{ .Values.controller.interval }}", "--fence-grace={{ .Values.controller.fenceGrace }}"]
          ports: [{name: health, containerPort: 8080}]
          resources:
{{ toYaml .Values.controller.resources | indent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: kairon-node, namespace: {{ .Release.Namespace }}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: kairon-node}}
  template:
    metadata: {labels: {app.kubernetes.io/name: kairon-node}}
    spec:
      serviceAccountName: kairon-node
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
{{ toYaml .Values.node.nodeSelector | indent 8 }}
      containers:
        - name: node
          image: "{{ .Values.node.image.repository }}:{{ .Values.node.image.tag }}"
          imagePullPolicy: {{ .Values.node.image.pullPolicy }}
          args: ["--interval={{ .Values.node.interval }}", "--fluxvm-url={{ .Values.node.fluxvmURL }}", "--default-backend={{ .Values.node.defaultBackend }}", "--image-root={{ .Values.node.imageRoot }}"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports: [{name: health, containerPort: 8081}]
          resources:
{{ toYaml .Values.node.resources | indent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
