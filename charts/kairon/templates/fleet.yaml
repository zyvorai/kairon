{{ if .Values.fleet.enabled }}
{{ if not (and .Values.webhook.enabled .Values.webhook.tlsSecretName .Values.webhook.caBundle (eq .Values.webhook.failurePolicy "Fail")) }}
{{ fail "fleet.enabled requires the validating webhook, TLS secret, CA bundle and failurePolicy=Fail" }}
{{ end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-fleet-controller}
rules:
  - apiGroups: [fleet.kairon.zyvor.dev]
    resources: [machinehaprofiles, nodefencerequests, machinebalancepolicies, machineautoscalers, machinerecoveryplans, machinebackupgroups, machineimportplans, machinetemplateversions, machinetemplateclaims, machinevirtualnetworks, machinenetworkclaims, machineusageledgers]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [fleet.kairon.zyvor.dev]
    resources: [machinehaprofiles/status, nodefencerequests/status, machinebalancepolicies/status, machineautoscalers/status, machinerecoveryplans/status, machinebackupgroups/status, machineimportplans/status, machinetemplateclaims/status, machinevirtualnetworks/status, machinenetworkclaims/status, machineusageledgers/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kairon-fleet-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kairon-fleet-controller}
subjects: [{kind: ServiceAccount, name: kairon-controller, namespace: {{ .Release.Namespace }}}]
{{ if .Values.fleet.redfishSecretNames }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kairon-fleet-bmc, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ .Values.fleet.redfishSecretNames | toJson }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kairon-fleet-bmc, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kairon-fleet-bmc}
subjects: [{kind: ServiceAccount, name: kairon-controller, namespace: {{ .Release.Namespace }}}]
{{ end }}
{{ if .Values.ui.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-fleet-ui}
rules:
  - apiGroups: [fleet.kairon.zyvor.dev]
    resources: [machinehaprofiles, nodefencerequests, machinebalancepolicies, machineautoscalers, machinerecoveryplans, machinebackupgroups, machineimportplans, machinetemplateversions, machinetemplateclaims, machinevirtualnetworks, machinenetworkclaims, machineusageledgers]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kairon-fleet-ui}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kairon-fleet-ui}
subjects: [{kind: ServiceAccount, name: kairon-ui, namespace: {{ .Release.Namespace }}}]
{{ end }}
{{ end }}
---
# Bind these separately to an agent and a human approver, in each tenant
# namespace. Neither role is automatically bound to a service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-action-approver}
rules:
  - apiGroups: [fleet.kairon.zyvor.dev]
    resources: [machineactionapprovals]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-action-consumer}
rules:
  - apiGroups: [fleet.kairon.zyvor.dev]
    resources: [machineactionapprovals]
    verbs: [get]
  - apiGroups: [fleet.kairon.zyvor.dev]
    resources: [machineactionapprovals/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairon-fleet-self-service}
rules:
  - apiGroups: [fleet.kairon.zyvor.dev]
    resources: [machinetemplateversions, machinevirtualnetworks, machinetemplateclaims, machinenetworkclaims]
    verbs: [get, list]
  - apiGroups: [fleet.kairon.zyvor.dev]
    resources: [machinetemplateclaims, machinenetworkclaims]
    verbs: [create]
