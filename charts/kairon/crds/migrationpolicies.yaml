apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: migrationpolicies.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: migrationpolicies
    singular: migrationpolicy
    kind: MigrationPolicy
    shortNames:
    - mp
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: MaxConcurrent
      type: integer
      jsonPath: .spec.maxConcurrent
    - name: BandwidthMbps
      type: integer
      jsonPath: .spec.bandwidthMbps
    - name: Active
      type: integer
      jsonPath: .status.activeMigrations
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - selector
            properties:
              selector:
                type: object
                additionalProperties:
                  type: string
              bandwidthMbps:
                type: integer
                minimum: 0
              maxConcurrent:
                type: integer
                minimum: 0
          status:
            type: object
            properties:
              activeMigrations:
                type: integer
