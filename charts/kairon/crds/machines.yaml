apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machines.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machines
    singular: machine
    kind: Machine
    shortNames:
    - km
    - kvmachine
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Node
      type: string
      jsonPath: .spec.nodeName
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: CPU
      type: string
      jsonPath: .spec.resources.cpu
    - name: Memory
      type: string
      jsonPath: .spec.resources.memory
    - name: IP
      type: string
      jsonPath: .status.guestIP
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            properties:
              nodeName:
                type: string
              instanceTypeName:
                type: string
                description: Names a MachineInstanceType (same namespace)
                  kairon-controller resolves into spec.resources exactly
                  once, the first time this is set and spec.resources is
                  still empty -- see docs/guides/machine-instance-types.md.
                  Either resources or instanceTypeName must resolve to a
                  real cpu/memory shape; enforced by kairon-controller/
                  kairon-node, not this schema, the same way spec.volumes
                  can substitute for image entirely.
              image:
                type: object
                description: Either path (an already-present file/PVC-resolved
                  disk) or source (a URL kairon-node downloads into its own
                  cache -- see docs/guides/machine-image-import.md) must be
                  set; enforced by kairon-node/the admission webhook, not
                  this schema, the same way spec.volumes can substitute for
                  image entirely.
                properties:
                  path:
                    type: string
                    minLength: 1
                  digest:
                    type: string
                  source:
                    type: object
                    properties:
                      httpURL:
                        type: string
                        minLength: 1
              resources:
                type: object
                properties:
                  cpu:
                    type: string
                    minLength: 1
                  memory:
                    type: string
                    minLength: 1
                  maxCpu:
                    type: string
                  maxMemory:
                    type: string
                  hugepages:
                    type: boolean
                  numaNode:
                    type: integer
                    minimum: 0
                  cpuSet:
                    type: string
                  limits:
                    type: object
                    properties:
                      cpuQuotaPercent:
                        type: integer
                        minimum: 1
                      memoryMaxBytes:
                        type: integer
                        format: int64
                        minimum: 1
                      ioWeight:
                        type: integer
                        minimum: 1
                        maximum: 10000
                      pidsMax:
                        type: integer
                        format: int64
                        minimum: 1
              runtime:
                type: object
                properties:
                  backend:
                    type: string
                    enum:
                    - auto
                    - qemu
                    - cloud-hypervisor
                    - firecracker
                    - flux-vm
                    default: auto
                  kernel:
                    type: string
              network:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - user
                    - tap
                    - macvtap
                    default: user
                  netns:
                    type: boolean
                    default: false
                  bridge:
                    type: string
                  parent:
                    type: string
                  mac:
                    type: string
                  tapName:
                    type: string
                  macvtapMode:
                    type: string
                    enum:
                    - bridge
                    - vepa
                    - private
                    - passthru
                  forwards:
                    type: array
                    items:
                      type: object
                      required:
                      - hostPort
                      - guestPort
                      properties:
                        hostPort:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        guestPort:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        protocol:
                          type: string
                          enum:
                          - tcp
                          - udp
                          default: tcp
                  staticNetwork:
                    type: boolean
                    default: false
                  podUID:
                    type: string
                  dataplaneRequired:
                    type: boolean
                    default: false
              cloudInit:
                type: object
                description: Operator-supplied guest customization forwarded to
                  FluxVM's own cloud-init NoCloud seed image. Only applied when
                  the FluxVM runtime is first created -- editing it on an existing
                  Machine has no effect, same as network.forwards and resources.
                properties:
                  hostname:
                    type: string
                  user:
                    type: string
                  sshAuthorizedKeys:
                    type: array
                    items:
                      type: string
                  packages:
                    type: array
                    items:
                      type: string
                  runCmd:
                    type: array
                    items:
                      type: string
                  writeFiles:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - content
                      properties:
                        path:
                          type: string
                        content:
                          type: string
                        permissions:
                          type: string
              powerState:
                type: string
                enum:
                - Running
                - Stopped
                - Paused
                - Halted
                default: Running
              tenant:
                type: string
              ttlSeconds:
                type: integer
                format: int64
                minimum: 0
              placement:
                type: object
                properties:
                  architecture:
                    type: string
                  nodeSelector:
                    type: object
                    additionalProperties:
                      type: string
                  affinity:
                    type: array
                    items:
                      type: object
                      required: ["labelSelector", "topologyKey"]
                      properties:
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        topologyKey:
                          type: string
                  antiAffinity:
                    type: array
                    items:
                      type: object
                      required: ["labelSelector", "topologyKey"]
                      properties:
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        topologyKey:
                          type: string
                  preferredAffinity:
                    type: array
                    items:
                      type: object
                      required: ["weight", "labelSelector", "topologyKey"]
                      properties:
                        weight:
                          type: integer
                          format: int32
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        topologyKey:
                          type: string
                  preferredAntiAffinity:
                    type: array
                    items:
                      type: object
                      required: ["weight", "labelSelector", "topologyKey"]
                      properties:
                        weight:
                          type: integer
                          format: int32
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        topologyKey:
                          type: string
                  topologySpreadConstraints:
                    type: array
                    items:
                      type: object
                      required: ["topologyKey", "labelSelector"]
                      properties:
                        topologyKey:
                          type: string
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        maxSkew:
                          type: integer
                          format: int32
                        whenUnsatisfiable:
                          type: string
                          enum: ["DoNotSchedule", "ScheduleAnyway"]
              security:
                type: object
                description: secureBoot/tpm are refused at creation time
                  (not silently ignored) -- no FluxVM backend implements
                  UEFI/OVMF firmware or a vTPM device today, see
                  docs/guides/machine-windows-guests.md.
                properties:
                  secureBoot:
                    type: boolean
                  tpm:
                    type: boolean
              volumes:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - claimName
                  properties:
                    name:
                      type: string
                      minLength: 1
                    claimName:
                      type: string
                      minLength: 1
              deviceClaims:
                type: array
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      minLength: 1
              guestAgent:
                type: object
                properties:
                  enabled:
                    type: boolean
                  console:
                    type: boolean
              sandbox:
                type: object
                properties:
                  templateName:
                    type: string
                  httpProxyPorts:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                      maximum: 65535
              serviceFabric:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - port
                      properties:
                        name:
                          type: string
                          minLength: 1
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        weight:
                          type: integer
                          minimum: 1
                          maximum: 65535
          status:
            type: object
            properties:
              phase:
                type: string
              nodeName:
                type: string
              runtimeID:
                type: string
              guestIP:
                type: string
              guestIPs:
                type: array
                items:
                  type: string
              observedGeneration:
                type: integer
                format: int64
              message:
                type: string
              appliedVCPUs:
                type: integer
              appliedMemoryMiB:
                type: integer
                format: int64
              appliedResourceLimits:
                type: object
                properties:
                  cpuQuotaPercent:
                    type: integer
                  memoryMaxBytes:
                    type: integer
                    format: int64
                  ioWeight:
                    type: integer
                  pidsMax:
                    type: integer
                    format: int64
              resourceUsage:
                type: object
                properties:
                  cpuPercent:
                    type: number
                  memoryBytes:
                    type: integer
                    format: int64
                  diskReadBytes:
                    type: integer
                    format: int64
                  diskWriteBytes:
                    type: integer
                    format: int64
              volumeStagingPath:
                type: string
              volumePublishPath:
                type: string
              volumeHandle:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              network:
                type: object
                properties:
                  guestIP:
                    type: string
                  guestIPs:
                    type: array
                    items:
                      type: string
                  tapName:
                    type: string
                  dataplane:
                    type: object
                    properties:
                      attached:
                        type: boolean
                      mode:
                        type: string
                      schemaVersion:
                        type: integer
                      identity:
                        type: integer
                      policyFingerprint:
                        type: string
                      policySynced:
                        type: boolean
                      interface:
                        type: string
