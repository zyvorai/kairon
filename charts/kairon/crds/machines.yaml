apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machines.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machines
    singular: machine
    kind: Machine
    shortNames:
    - km
    - kvmachine
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources: &subresources
      status: {}
    additionalPrinterColumns: &columns
    - name: Node
      type: string
      jsonPath: .spec.nodeName
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: CPU
      type: string
      jsonPath: .spec.resources.cpu
    - name: Memory
      type: string
      jsonPath: .spec.resources.memory
    - name: IP
      type: string
      jsonPath: .status.guestIP
    - name: Message
      type: string
      jsonPath: .status.message
    schema: &schema
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            properties:
              nodeName:
                type: string
              instanceTypeName:
                type: string
                description: Names a MachineInstanceType (same namespace)
                  kairon-controller resolves into spec.resources exactly
                  once, the first time this is set and spec.resources is
                  still empty -- see docs/guides/machine-instance-types.md.
                  Either resources or instanceTypeName must resolve to a
                  real cpu/memory shape; enforced by kairon-controller/
                  kairon-node, not this schema, the same way spec.volumes
                  can substitute for image entirely.
              image:
                type: object
                description: Either path (an already-present file/PVC-resolved
                  disk) or source (a URL kairon-node downloads into its own
                  cache -- see docs/guides/machine-image-import.md) must be
                  set; enforced by kairon-node/the admission webhook, not
                  this schema, the same way spec.volumes can substitute for
                  image entirely.
                properties:
                  path:
                    type: string
                    minLength: 1
                  digest:
                    type: string
                  source:
                    type: object
                    properties:
                      httpURL:
                        type: string
                        minLength: 1
                      oci:
                        type: string
                        minLength: 1
                        description: containerDisk registry reference
                          ([registry/]repository[:tag][@sha256:...]); pulled
                          over HTTPS by the manifest digest in
                          spec.image.digest. Mutually exclusive with httpURL.
                      format:
                        type: string
                        enum: ["qcow2", "raw", "ova", "vmdk", "vhd", "vhdx"]
                      repair:
                        type: boolean
                  catalogName:
                    type: string
                    minLength: 1
              resources:
                type: object
                properties:
                  cpu:
                    type: string
                    minLength: 1
                  memory:
                    type: string
                    minLength: 1
                  maxCpu:
                    type: string
                  maxMemory:
                    type: string
                  hugepages:
                    type: boolean
                  numaNode:
                    type: integer
                    minimum: 0
                  cpuSet:
                    type: string
                  cpuPinning:
                    type: boolean
                  allocatedCpuSet:
                    type: array
                    items:
                      type: integer
                      minimum: 0
                  limits:
                    type: object
                    properties:
                      cpuQuotaPercent:
                        type: integer
                        minimum: 1
                      memoryMaxBytes:
                        type: integer
                        format: int64
                        minimum: 1
                      ioWeight:
                        type: integer
                        minimum: 1
                        maximum: 10000
                      pidsMax:
                        type: integer
                        format: int64
                        minimum: 1
                      cpuSetCpus:
                        type: array
                        items:
                          type: integer
                          minimum: 0
              runtime:
                type: object
                properties:
                  backend:
                    type: string
                    enum:
                    - auto
                    - qemu
                    - cloud-hypervisor
                    - firecracker
                    - flux-vm
                    default: auto
                  kernel:
                    type: string
              network:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - user
                    - tap
                    - macvtap
                    default: user
                  netns:
                    type: boolean
                    default: false
                  bridge:
                    type: string
                  parent:
                    type: string
                  mac:
                    type: string
                  tapName:
                    type: string
                  macvtapMode:
                    type: string
                    enum:
                    - bridge
                    - vepa
                    - private
                    - passthru
                  forwards:
                    type: array
                    items:
                      type: object
                      required:
                      - hostPort
                      - guestPort
                      properties:
                        hostPort:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        guestPort:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        protocol:
                          type: string
                          enum:
                          - tcp
                          - udp
                          default: tcp
                  staticNetwork:
                    type: boolean
                    default: false
                  podUID:
                    type: string
                  dataplaneRequired:
                    type: boolean
                    default: false
                  dataplaneMode:
                    type: string
                    description: FluxVM sandbox dataplane mode (legacy|ebpf|cilium). Empty uses FluxVM's own default.
                    enum:
                    - legacy
                    - ebpf
                    - cilium
                  ciliumAttach:
                    type: boolean
                    description: When true, kairon-controller reconciles a CiliumExternalWorkload so this Machine can join the cluster Cilium network. Requires mode=tap and netns=true.
                    default: false
                  ciliumNamespace:
                    type: string
                    description: Reserved for future namespaced attach hints (ExternalWorkload is cluster-scoped).
                  ciliumLabels:
                    type: object
                    additionalProperties:
                      type: string
                    description: Extra labels applied to the CiliumExternalWorkload.
                  antiSpoof:
                    type: boolean
                    default: false
                    description: Drop frames whose source MAC or IP is not assigned to this Machine. Enforced by the FluxVM eBPF edge.
                  learnIP:
                    type: boolean
                    default: false
                    description: Learn guestIP from ARP, DHCP, or ND so agent-less guests still project an address.
                  qos:
                    type: object
                    description: Per-Machine token bucket projected into the FluxVM eBPF edge.
                    properties:
                      ingressMbps:
                        type: integer
                        minimum: 1
                      egressMbps:
                        type: integer
                        minimum: 1
                      ingressPps:
                        type: integer
                        minimum: 1
                      egressPps:
                        type: integer
                        minimum: 1
                  extraInterfaces:
                    type: array
                    description: Bridged NICs hot-added to the running guest (mode tap only) and hot-removed when dropped. See docs/guides/machine-hotplug.md.
                    maxItems: 3
                    x-kubernetes-list-type: map
                    x-kubernetes-list-map-keys: [name]
                    items:
                      type: object
                      required: [name, bridge]
                      properties:
                        name:
                          type: string
                          pattern: '^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$'
                        bridge:
                          type: string
                          minLength: 1
                          maxLength: 15
                        mac:
                          type: string
                          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
                          description: Defaults to a MAC derived from the Machine UID and name.
              cloudInit:
                type: object
                description: Operator-supplied guest customization forwarded to
                  FluxVM's own cloud-init NoCloud seed image. Only applied when
                  the FluxVM runtime is first created -- editing it on an existing
                  Machine has no effect, same as network.forwards and resources.
                properties:
                  hostname:
                    type: string
                  user:
                    type: string
                  sshAuthorizedKeys:
                    type: array
                    items:
                      type: string
                  packages:
                    type: array
                    items:
                      type: string
                  runCmd:
                    type: array
                    items:
                      type: string
                  writeFiles:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - content
                      properties:
                        path:
                          type: string
                        content:
                          type: string
                        permissions:
                          type: string
              powerState:
                type: string
                enum:
                - Running
                - Stopped
                - Paused
                - Halted
                default: Running
              tenant:
                type: string
                description: >-
                  Optional tenant name (DNS-1123 label). With the admission
                  webhook on, a set tenant cannot be renamed or cleared.
                  Annotation kairon.zyvor.dev/tenant-fence=true makes it an
                  east-west deny against other tenants' observed guest
                  addresses in the same namespace; see
                  docs/guides/tenant-fence.md. It is not a quota or RBAC
                  boundary: Kubernetes Namespace still is.
              ttlSeconds:
                type: integer
                format: int64
                minimum: 0
              priority:
                type: integer
                format: int32
              placement:
                type: object
                properties:
                  architecture:
                    type: string
                  nodeSelector:
                    type: object
                    additionalProperties:
                      type: string
                  affinity:
                    type: array
                    items:
                      type: object
                      required: ["labelSelector", "topologyKey"]
                      properties:
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        topologyKey:
                          type: string
                  antiAffinity:
                    type: array
                    items:
                      type: object
                      required: ["labelSelector", "topologyKey"]
                      properties:
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        topologyKey:
                          type: string
                  preferredAffinity:
                    type: array
                    items:
                      type: object
                      required: ["weight", "labelSelector", "topologyKey"]
                      properties:
                        weight:
                          type: integer
                          format: int32
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        topologyKey:
                          type: string
                  preferredAntiAffinity:
                    type: array
                    items:
                      type: object
                      required: ["weight", "labelSelector", "topologyKey"]
                      properties:
                        weight:
                          type: integer
                          format: int32
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        topologyKey:
                          type: string
                  topologySpreadConstraints:
                    type: array
                    items:
                      type: object
                      required: ["topologyKey", "labelSelector"]
                      properties:
                        topologyKey:
                          type: string
                        labelSelector:
                          type: object
                          additionalProperties:
                            type: string
                        maxSkew:
                          type: integer
                          format: int32
                        whenUnsatisfiable:
                          type: string
                          enum: ["DoNotSchedule", "ScheduleAnyway"]
                  tolerations:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum: ["Equal", "Exists"]
                        value:
                          type: string
                        effect:
                          type: string
                          enum: ["NoSchedule", "PreferNoSchedule", "NoExecute"]
              security:
                type: object
                description: secureBoot/tpm are refused at creation time
                  (not silently ignored) -- no FluxVM backend implements
                  UEFI/OVMF firmware or a vTPM device today, see
                  docs/guides/machine-windows-guests.md.
                properties:
                  secureBoot:
                    type: boolean
                  tpm:
                    type: boolean
              volumes:
                type: array
                items:
                  type: object
                  required:
                  - name
                  x-kubernetes-validations:
                  - rule: "has(self.claimName) || has(self.atlas)"
                    message: "each volume needs claimName or atlas"
                  properties:
                    name:
                      type: string
                      minLength: 1
                    claimName:
                      type: string
                      description: Existing PersistentVolumeClaim. With atlas (mode pvc) the controller fills this in once Atlas has created the PVC.
                    atlas:
                      type: object
                      description: Provision this volume through the Atlas storage control plane before scheduling (requires kairon-controller --atlas-url). See docs/guides/machine-storage-atlas.md.
                      required:
                      - size
                      properties:
                        size:
                          type: string
                          pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|K|k|M|G|T)?$'
                        mode:
                          type: string
                          enum: [pvc, rbd]
                          description: pvc (default) creates a PVC on a StorageClass; rbd creates a raw Ceph RBD image the node opens in place.
                        policy:
                          type: string
                        storageClass:
                          type: string
                        backendID:
                          type: string
                        pool:
                          type: string
                        retain:
                          type: boolean
                          description: Keep the Atlas volume when the Machine is deleted.
                    guestPath:
                      type: string
                      description: Guest mount path for volumes[1+] virtiofs shares (default /mnt/<name>). Ignored for volumes[0] boot disk.
                    readOnly:
                      type: boolean
                      description: Mount volumes[1+] virtiofs share read-only.
              disks:
                type: array
                description: PVC-backed block disks hot-attached to the running guest as SCSI disks (serial = name) and detached when removed. hostPath/local PVs only; Block mode attaches the device, Filesystem mode the disk.img inside it. See docs/guides/machine-hotplug.md.
                maxItems: 16
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name, claimName]
                  x-kubernetes-validations:
                  - rule: "self.name != 'root'"
                    message: "disk name 'root' is reserved for the boot disk"
                  properties:
                    name:
                      type: string
                      pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
                    claimName:
                      type: string
                      minLength: 1
              deviceClaims:
                type: array
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      minLength: 1
              guestAgent:
                type: object
                properties:
                  enabled:
                    type: boolean
                  console:
                    type: boolean
              sandbox:
                type: object
                properties:
                  templateName:
                    type: string
                  httpProxyPorts:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                      maximum: 65535
              serviceFabric:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - port
                      properties:
                        name:
                          type: string
                          minLength: 1
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        weight:
                          type: integer
                          minimum: 1
                          maximum: 65535
          status:
            type: object
            properties:
              phase:
                type: string
              nodeName:
                type: string
              runtimeID:
                type: string
              guestIP:
                type: string
              guestIPs:
                type: array
                items:
                  type: string
              observedGeneration:
                type: integer
                format: int64
              message:
                type: string
              appliedVCPUs:
                type: integer
              appliedMemoryMiB:
                type: integer
                format: int64
              appliedResourceLimits:
                type: object
                properties:
                  cpuQuotaPercent:
                    type: integer
                  memoryMaxBytes:
                    type: integer
                    format: int64
                  ioWeight:
                    type: integer
                  pidsMax:
                    type: integer
                    format: int64
                  cpuSetCpus:
                    type: array
                    items:
                      type: integer
                      minimum: 0
              resourceUsage:
                type: object
                properties:
                  cpuPercent:
                    type: number
                  memoryBytes:
                    type: integer
                    format: int64
                  diskReadBytes:
                    type: integer
                    format: int64
                  diskWriteBytes:
                    type: integer
                    format: int64
              volumeStagingPath:
                type: string
              volumePublishPath:
                type: string
              volumeHandle:
                type: string
              volumeDriver:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              # kairon-node's own ground truth of exactly which Service
              # Fabric (service, port, guestIP) backends it has registered
              # for this Machine -- FluxVM has no query for this, so
              # reconcileServiceFabric diffs against this field (not
              # against current spec) to prune a stale backend left behind
              # by a guestIP change or a spec.serviceFabric.services edit,
              # see internal/agent/network.go.
              appliedServiceFabricMemberships:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    port:
                      type: integer
                    guestIP:
                      type: string
              attachedDisks:
                type: array
                items:
                  type: string
              diskVolumes:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    node:
                      type: string
                    driver:
                      type: string
                    volumeHandle:
                      type: string
                    stagingPath:
                      type: string
                    publishPath:
                      type: string
                    block:
                      type: boolean
              attachedInterfaces:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    bridge:
                      type: string
                    mac:
                      type: string
              network:
                type: object
                properties:
                  guestIP:
                    type: string
                  guestIPs:
                    type: array
                    items:
                      type: string
                  tapName:
                    type: string
                  dataplane:
                    type: object
                    properties:
                      attached:
                        type: boolean
                      mode:
                        type: string
                      schemaVersion:
                        type: integer
                      identity:
                        type: integer
                      policyFingerprint:
                        type: string
                      policySynced:
                        type: boolean
                      interface:
                        type: string
                  cilium:
                    type: object
                    properties:
                      externalWorkload:
                        type: string
                      externalWorkloadUID:
                        type: string
                      identity:
                        type: integer
                      ipv4:
                        type: string
                      message:
                        type: string
                  edge:
                    type: object
                    description: VM-edge eBPF projection. Identity is stable across IP changes.
                    properties:
                      identity:
                        type: integer
                      guestIPSource:
                        type: string
                        enum:
                        - agent
                        - arp
                        - dhcp
                        - nd
                      antiSpoof:
                        type: boolean
                      policyName:
                        type: string
                      conntrackRestored:
                        type: integer
                      blackholeWindowMs:
                        type: integer
  - name: v1alpha1
    served: true
    storage: false
    subresources: *subresources
    additionalPrinterColumns: *columns
    schema: *schema
