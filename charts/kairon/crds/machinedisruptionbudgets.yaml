apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinedisruptionbudgets.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinedisruptionbudgets
    singular: machinedisruptionbudget
    kind: MachineDisruptionBudget
    shortNames:
    - mdb
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: MinAvailable
      type: string
      jsonPath: .spec.minAvailable
    - name: MaxUnavailable
      type: string
      jsonPath: .spec.maxUnavailable
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - selector
            properties:
              selector:
                type: object
                additionalProperties:
                  type: string
              minAvailable:
                type: string
              maxUnavailable:
                type: string
          # No controller reconciles this object in v1 (kaironctl evacuate
          # computes disruption allowance on the fly) -- the status
          # subresource exists for schema consistency with every other
          # Kairon CRD, not because anything writes to it today.
          status:
            type: object
            properties: {}
