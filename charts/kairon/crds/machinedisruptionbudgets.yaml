apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinedisruptionbudgets.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinedisruptionbudgets
    singular: machinedisruptionbudget
    kind: MachineDisruptionBudget
    shortNames:
    - mdb
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: MinAvailable
      type: string
      jsonPath: .spec.minAvailable
    - name: MaxUnavailable
      type: string
      jsonPath: .spec.maxUnavailable
    - name: Allowed
      type: integer
      jsonPath: .status.disruptionsAllowed
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - selector
            properties:
              selector:
                type: object
                additionalProperties:
                  type: string
              minAvailable:
                type: string
              maxUnavailable:
                type: string
          # kairon-controller reconciles this every tick (see
          # internal/controller/disruption.go's
          # reconcileDisruptionBudgetsStatus), mirroring a real Kubernetes
          # PodDisruptionBudget's status -- purely observational, it does
          # not itself gate anything (kaironctl evacuate/the admission
          # webhook recompute their own allowance fresh, they don't trust
          # this status as authoritative for an in-flight decision, since
          # it can be one reconcile tick stale).
          status:
            type: object
            properties:
              expectedMachines:
                type: integer
              currentHealthy:
                type: integer
              desiredHealthy:
                type: integer
              disruptionsAllowed:
                type: integer
