apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinequotas.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinequotas
    singular: machinequota
    kind: MachineQuota
    shortNames:
    - mq
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: MaxMachines
      type: integer
      jsonPath: .spec.maxMachines
    - name: UsedMachines
      type: integer
      jsonPath: .status.usedMachines
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            properties:
              maxMachines:
                type: integer
                minimum: 0
              maxTotalCpu:
                type: string
              maxTotalMemory:
                type: string
          status:
            type: object
            properties:
              usedMachines:
                type: integer
              usedTotalCpuCores:
                type: integer
              usedTotalMemoryMiB:
                type: integer
