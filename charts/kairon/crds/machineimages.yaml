apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineimages.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Cluster
  names:
    plural: machineimages
    singular: machineimage
    kind: MachineImage
    shortNames:
    - mimg
  versions:
  - name: v1beta1
    served: true
    storage: true
    additionalPrinterColumns: &columns
    - name: Kind
      type: string
      jsonPath: .spec.kind
    - name: OS
      type: string
      jsonPath: .spec.os
    - name: Family
      type: string
      jsonPath: .spec.family
    - name: Version
      type: string
      jsonPath: .spec.version
    - name: Digest
      type: string
      jsonPath: .spec.digest
      priority: 1
    schema: &schema
      openAPIV3Schema:
        type: object
        description: A named, versioned boot disk (kind disk) or install
          medium (kind iso). Machines reference it by name; kairon-controller
          pins its source and digest into the Machine once. See
          docs/guides/machine-images.md.
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - source
            - digest
            properties:
              displayName:
                type: string
              family:
                type: string
              version:
                type: string
              kind:
                type: string
                enum: ["disk", "iso"]
              os:
                type: string
              deprecated:
                type: boolean
              digest:
                type: string
                pattern: '^sha256:[0-9a-f]{64}$'
              source:
                type: object
                properties:
                  httpURL:
                    type: string
                    minLength: 1
                  oci:
                    type: string
                    minLength: 1
                  format:
                    type: string
                    enum: ["qcow2", "raw", "ova", "vmdk", "vhd", "vhdx"]
                  repair:
                    type: boolean
                  insecureSkipTLSVerify:
                    type: boolean
              defaults:
                type: object
                properties:
                  cpu:
                    type: string
                  memory:
                    type: string
                  diskSize:
                    type: string
  - name: v1alpha1
    served: true
    storage: false
    additionalPrinterColumns: *columns
    schema: *schema
