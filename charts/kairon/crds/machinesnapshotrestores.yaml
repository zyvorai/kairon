apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinesnapshotrestores.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinesnapshotrestores
    singular: machinesnapshotrestore
    kind: MachineSnapshotRestore
    shortNames:
    - kmsr
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Snapshot
      type: string
      jsonPath: .spec.snapshotName
    - name: Claim
      type: string
      jsonPath: .status.restoredClaimName
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - snapshotName
            - targetClaimName
            properties:
              snapshotName:
                type: string
                minLength: 1
              volumeName:
                type: string
              targetClaimName:
                type: string
                minLength: 1
              storageClassName:
                type: string
              storageSize:
                type: string
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              restoredClaimName:
                type: string
