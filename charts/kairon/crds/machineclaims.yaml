apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineclaims.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machineclaims
    singular: machineclaim
    kind: MachineClaim
    shortNames:
    - mclaim
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources: &subresources
      status: {}
    additionalPrinterColumns: &columns
    - name: Pool
      type: string
      jsonPath: .spec.poolName
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Machine
      type: string
      jsonPath: .status.machineName
    - name: Bind-ms
      type: integer
      jsonPath: .status.bindMillis
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema: &schema
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - poolName
            properties:
              poolName:
                type: string
                minLength: 1
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: poolName is immutable
              labels:
                type: object
                additionalProperties:
                  type: string
              reclaimPolicy:
                type: string
                enum: ["Delete", "Retain"]
              ttlSeconds:
                type: integer
                minimum: 1
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Pending", "Bound", "Lost"]
              machineName:
                type: string
              boundAt:
                type: string
                format: date-time
              bindMillis:
                type: integer
              message:
                type: string
  - name: v1alpha1
    served: true
    storage: false
    subresources: *subresources
    additionalPrinterColumns: *columns
    schema: *schema
