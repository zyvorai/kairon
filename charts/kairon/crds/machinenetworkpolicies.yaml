apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinenetworkpolicies.kairon.zyvor.dev
spec:
  group: kairon.zyvor.dev
  scope: Namespaced
  names:
    plural: machinenetworkpolicies
    singular: machinenetworkpolicy
    kind: MachineNetworkPolicy
    shortNames:
    - kmnp
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Machine
      type: string
      jsonPath: .spec.machineName
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - policy
            properties:
              machineName:
                type: string
              selector:
                type: object
                additionalProperties:
                  type: string
              policy:
                type: object
                properties:
                  defaultAllow:
                    type: boolean
                  allowCidrs:
                    type: array
                    items:
                      type: string
                  denyCidrs:
                    type: array
                    items:
                      type: string
                  allowPorts:
                    type: array
                    items:
                      type: string
                  maxEgressMbps:
                    type: integer
                    minimum: 0
                  maxEgressPps:
                    type: integer
                    minimum: 0
                  allowFqdns:
                    type: array
                    items:
                      type: string
                  groups:
                    type: array
                    items:
                      type: string
                  labels:
                    type: array
                    items:
                      type: string
                  entities:
                    type: array
                    items:
                      type: string
                  auditMode:
                    type: boolean
                  allowIcmp:
                    type: boolean
                  sampleRate:
                    type: integer
                    minimum: 0
              cnp:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              cilium:
                type: object
                description: Opt-in sync onto a real cluster CiliumNetworkPolicy CR.
                properties:
                  sync:
                    type: boolean
                    default: false
                  policyName:
                    type: string
                    description: Name of the CiliumNetworkPolicy to create; defaults to this object's metadata.name.
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              observedMachines:
                type: integer
              lastAppliedTime:
                type: string
                format: date-time
              effectiveSynced:
                type: boolean
              appliedMachines:
                type: array
                items:
                  type: string
              ciliumNetworkPolicyRef:
                type: string
              ciliumSyncMessage:
                type: string
