controller:
  image:
    repository: ghcr.io/zyvorai/kairon-controller
    tag: latest
    pullPolicy: IfNotPresent
  interval: 5s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
node:
  image:
    repository: ghcr.io/zyvorai/kairon-node
    tag: latest
    pullPolicy: IfNotPresent
  interval: 3s
  fluxvmURL: http://127.0.0.1:7788
  defaultBackend: qemu
  imageRoot: /var/lib/fluxvm/images
  nodeSelector:
    kairon.zyvor.dev/capable: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
