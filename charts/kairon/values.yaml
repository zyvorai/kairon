controller:
  image:
    repository: ghcr.io/zyvorai/kairon-controller
    tag: latest
    pullPolicy: IfNotPresent
  interval: 5s
  # /healthz /readyz port. Change if it collides with something else
  # already running on a node sharing this container's network namespace
  # (found the hard way once already -- see console.port below).
  healthPort: 8080
  # A single reconciler is lightweight by design (see internal/controller:
  # no in-memory cache, every tick re-lists from the API) -- raising
  # replicaCount is about HA, not throughput; there's no data yet on this
  # reconcile loop's real per-replica breaking point (see ROADMAP.md).
  replicaCount: 1
  leaderElection:
    # Coordinates multiple replicas via a coordination.k8s.io/v1 Lease
    # (see internal/leaderelection) so only the elected leader reconciles
    # -- required once replicaCount > 1 (two un-coordinated reconcilers
    # would race on the same Machines/MachineMigrations), but on by
    # default even at replicaCount: 1 since it's a no-op single-writer
    # race there and this way scaling up later never means flipping a
    # flag on a config an operator forgot existed. The admission webhook
    # and health/metrics server are unaffected -- they're stateless
    # per-request reads, served from every replica regardless.
    enabled: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
  podDisruptionBudget:
    # Only affects voluntary eviction (e.g. `kubectl drain`) of the single
    # kairon-controller replica -- essentially no downside, so on by
    # default (see templates/pdb.yaml).
    enabled: true
  networkPolicy:
    # Off by default: restricts ingress to kairon-controller's health/metrics
    # port (and the webhook port, if webhook.enabled) to same-namespace pods
    # plus allowIngressFrom below. Get allowIngressFrom wrong (e.g. Prometheus
    # lives in another namespace) and scraping breaks silently -- see
    # templates/networkpolicy.yaml.
    enabled: false
    # Each entry is a full NetworkPolicyPeer (namespaceSelector and/or
    # podSelector), e.g.:
    #   allowIngressFrom:
    #     - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
    allowIngressFrom: []
node:
  image:
    repository: ghcr.io/zyvorai/kairon-node
    tag: latest
    pullPolicy: IfNotPresent
  interval: 3s
  # /healthz /readyz port -- runs with hostNetwork: true (see below), so
  # this shares the node's real port space, not just this container's.
  # Confirmed against a real host: the default console.port (8090)
  # collided with an unrelated Docker container already using it there.
  healthPort: 8081
  # One kairon-node per capable node (DaemonSet); same lightweight,
  # cache-free reconcile design as the controller.
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
  fluxvmURL: http://127.0.0.1:7788
  defaultBackend: qemu
  imageRoot: /var/lib/fluxvm/images
  # Comma-separated PCI BDFs, e.g. 0000:65:00.0. Empty is fail-closed for DeviceClaims.
  vfioAllowlist: ""
  nodeSelector:
    kairon.zyvor.dev/capable: "true"
  # csi: how kairon-node reaches kairon-csi-node's local Unix socket to
  # resolve a network-block (CSI-backed) Machine boot disk -- see
  # csiNode below. Ignored entirely (and safe to leave at these defaults)
  # unless csiNode.enabled is also true.
  csi:
    socketDir: /var/lib/kubelet/plugins/csi.kairon.zyvor.dev
    stagingDir: /var/lib/kairon/csi/staging
    publishDir: /var/lib/kairon/csi/publish
csiNode:
  # Kairon's own first-cut CSI node plugin (see internal/csinode,
  # docs/guides/machine-storage-csi.md): one backend (iSCSI), no dynamic
  # provisioning -- PersistentVolumes reference it statically. Off by
  # default; enabling it is what lets a Machine's spec.volumes[0]
  # reference a network-block (CSI-backed) PersistentVolume instead of
  # only hostPath/local ones. This is the one place Kairon's own images
  # aren't built from the minimal distroless base every other component
  # uses (a real iSCSI initiator and filesystem tooling need a real OS
  # around them) and the one Kairon-built container that runs privileged
  # -- both inherent to actually attaching/mounting network block devices
  # from a container, see SECURITY.md.
  enabled: false
  image:
    repository: ghcr.io/zyvorai/kairon-csi-node
    tag: latest
    pullPolicy: IfNotPresent
  # The upstream, Kubernetes-maintained sidecar that registers this
  # plugin with kubelet -- not something Kairon implements itself; every
  # real CSI driver in the ecosystem deploys this exact sidecar the same
  # way. See https://github.com/kubernetes-csi/node-driver-registrar.
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.18.0
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  nodeSelector:
    kairon.zyvor.dev/capable: "true"
migration:
  # Secure peer preparation is opt-in until a Kairon migration adapter is installed.
  enabled: false
  port: 9443
  tlsSecretName: kairon-migration-tls
  # DNS SAN expected in the shared cluster migration certificate.
  tlsServerName: kairon-node
  stateDir: /var/run/kairon/migrations
  # Empty uses emptyDir. For node-reboot/pod-replacement durability, pre-create a
  # writable host directory for UID 65532 and set this path.
  stateHostPath: ""
  # Optional local Kairon migration adapter. Current FluxVM does not expose this
  # contract, so leave empty unless an adapter is installed on every VM node.
  adapterSocket: ""
  adapterHostPath: ""
  # Authenticate/encrypt the QEMU migration data stream (not just the
  # control-plane RPCs, which always use mTLS) via TLS. Opt-in: enable only
  # once every node's kairon-migration-adapter-fluxvm and FluxVM binary is
  # upgraded to support it (see ROADMAP v0.4). Requires adapterHostPath, so
  # the host-level adapter systemd unit can read the same cert material this
  # chart already gives kairon-node via tlsSecretName.
  #
  # IMPORTANT: this Helm value only controls whether cert material is
  # *staged* onto adapterHostPath -- the actual -migration-data-tls
  # enforcement flag lives in each node's kairon-migration-adapter-fluxvm
  # systemd unit ExecStart, entirely outside Helm's control. Flipping this
  # alone does NOT turn encryption on cluster-wide. Before flipping it (or
  # the systemd units), verify every currently-active live migration already
  # reports status.dataPlaneEncrypted=true (also exposed as the
  # kairon_migration_dataplane_encrypted metric) -- see
  # docs/runbook-migration-failures.md#unencrypted-migration-data-plane.
  dataplaneTls: false
  # Optional: a Secret (NOT chart-managed, same posture as tlsSecretName)
  # bundling a REAL PER-NODE data-plane cert for every node in the fleet --
  # keys named "<nodeName>-ca.crt"/"<nodeName>-tls.crt"/"<nodeName>-tls.key"
  # for each one. scripts/gen-migration-mtls-certs.sh generates both the
  # certs and a ready-to-apply Secret manifest in this exact shape. Each
  # kairon-node pod's init container picks out *only its own* node's three
  # files (via the Downward API's spec.nodeName) before staging them onto
  # adapterHostPath -- unlike tlsSecretName's cluster-membership cert
  # (deliberately shared, see its own comment above), a real per-node cert
  # here means one node presenting another node's identity on the data
  # plane is cryptographically impossible, not just discouraged.
  #
  # Left empty (the default), dataplaneTls falls back to staging
  # tlsSecretName's own shared cert onto the data plane too -- weaker
  # (every node can present the same identity there), but exactly today's
  # behavior, so no existing deployment's `helm upgrade` needs to change
  # anything to keep working. Set this once you're ready to move to real
  # per-node data-plane identity -- see docs/guides/machine-migration-tls.md.
  dataplaneTlsSecretName: ""
  # Admission quota: caps concurrent non-terminal migrations touching one
  # node, and optionally cluster-wide. Rejected into the existing Blocked
  # phase, same mechanism as an unschedulable target. 0 = unlimited (today's
  # behavior). This is the "rate limiting" control for migration storms
  # (e.g. a bulk `kaironctl evacuate` draining many Machines from one node
  # at once). A capacity-Blocked migration is transient (unlike a real
  # misconfiguration) but nothing auto-retries it yet -- re-trigger it via
  # `kaironctl evacuate`/recreating the MachineMigration (which already
  # generates a fresh, timestamped name each time).
  maxConcurrentPerNode: 0
  maxConcurrentCluster: 0
console:
  # Graphical VNC console relay (browser -> kairon-ui -> kairon-node ->
  # the VM's local QEMU VNC socket). Off by default -- opt in once
  # ui.enabled is also true, same posture as migration.enabled. See
  # SECURITY.md's "VNC console" section for the trust model before
  # enabling this on a shared cluster.
  enabled: false
  # Port kairon-node's console relay listens on and kairon-ui connects to.
  # kairon-node runs with hostNetwork: true, so this is a real node-wide
  # port, not just this container's -- change it if 8090 collides with
  # something else already running on your nodes (this default did, on a
  # real host, with an unrelated Docker container).
  port: 8090
  # existingSecret: a pre-created Secret with a "token" key instead of the
  # one the chart generates and persists automatically (same
  # lookup+randAlphaNum pattern as kairon-ui-session).
  existingSecret: ""
  existingSecretKey: "token"
  tls:
    # Opt-in one-way TLS on the kairon-ui -> kairon-node console hop
    # (plaintext HTTP with the shared token otherwise -- see SECURITY.md's
    # "VNC console" section). Not mutual TLS: the shared console token
    # above already authenticates kairon-ui to kairon-node, so kairon-node
    # only needs a server certificate, not a client-cert-verifying one.
    enabled: false
    # secretName: a pre-created Secret with tls.crt/tls.key (kairon-node's
    # server certificate/key) and ca.crt (the CA kairon-ui verifies it
    # against) -- required when tls.enabled is true. No chart-generated
    # default; unlike the console token, a real CA/cert pair isn't
    # something Helm should be minting for you.
    secretName: ""
webhook:
  # Validating admission webhooks closing the two gaps documented on
  # MachineQuota/MachineDisruptionBudget: without this, a namespace can
  # always create a Machine object even over quota (it just stays Pending,
  # see internal/controller/quota.go), and a MachineMigration created
  # directly through the API bypasses any MachineDisruptionBudget entirely
  # (see internal/controller/disruption.go). Off by default -- like
  # migration.tlsSecretName/console.tls.secretName above, this chart does
  # not mint a serving certificate for you; the webhook can't come up
  # without one, so leaving it off is the only safe default.
  enabled: false
  # A pre-created Secret with tls.crt/tls.key -- kairon-controller's
  # webhook HTTPS serving certificate. Required when enabled is true.
  tlsSecretName: ""
  # The CA that signed tlsSecretName's certificate, base64-encoded PEM --
  # goes into the ValidatingWebhookConfiguration's caBundle so the API
  # server can verify kairon-controller's cert when calling the webhook.
  # Get this wrong (or let it expire without rotating) and every Machine/
  # MachineMigration write in the cluster starts failing per failurePolicy
  # below -- there is deliberately no default.
  caBundle: ""
  port: 8443
  # Fail closes the actual bypass (a webhook outage blocks all Machine/
  # MachineMigration writes cluster-wide); Ignore trades that guarantee
  # for availability -- enforcement becomes best-effort, same as before
  # this webhook existed.
  failurePolicy: Fail
metrics:
  # Wrap charts/kairon/alerts.yaml as a real PrometheusRule custom resource,
  # for clusters running prometheus-operator. Off by default since not every
  # cluster has the PrometheusRule CRD installed; otherwise, copy
  # alerts.yaml's rule group into your own Prometheus rule_files config.
  prometheusRule:
    enabled: false
ui:
  # Web dashboard (cmd/kairon-ui). Off by default -- opt in once you have a
  # token ready, same posture as migration.enabled.
  enabled: false
  # More than 1 is safe once ui.auth.users (or the seeded default admin) is
  # in use: session revocation, login lockout, and console tickets all
  # propagate across replicas via a shared kairon-ui-shared-state
  # ConfigMap this chart always creates alongside kairon-ui, and password
  # changes propagate via the existing kairon-ui-users Secret every
  # replica already shares -- see internal/uiapi/sharedstate.go and
  # docs/guides/kairon-ui-ha.md. Propagation lands within ~15s, not
  # instantly, and a login-lockout threshold is evaluated per-replica, not
  # as one cluster-wide counter -- real, documented first-cut limits, not
  # bugs.
  replicaCount: 1
  image:
    repository: ghcr.io/zyvorai/kairon-ui
    tag: latest
    pullPolicy: IfNotPresent
  # Static bearer token every /api/v1/... request must present. Required
  # unless allowUnauthenticated is set -- kairon-ui can create/delete
  # Machines and force migration recovery actions, so it refuses to start
  # wide open by accident (both here, via {{ fail }}, and independently in
  # the Go binary itself -- see cmd/kairon-ui/main.go).
  token: ""
  # Reference a pre-created Secret instead of ui.token, so the token never
  # has to pass through `helm --set`/stored release values (which land in
  # `helm get values` output and shell history) -- same escape hatch
  # operators already need for migration.tlsSecretName. When set, ui.token
  # above is ignored and this chart does not create a Secret at all.
  existingSecret: ""
  # Key within existingSecret holding the token. Ignored unless
  # existingSecret is set.
  existingSecretKey: "token"
  # Local development only. Never set this in a real cluster.
  allowUnauthenticated: false
  auth:
    # Real per-operator username/password login (docs/getting-started.md),
    # alongside -- not instead of -- the legacy shared ui.token above.
    # Generate each entry's passwordHash with: kairon-ui -hash-password 'the password'
    # Set admin: true on an entry to let that account reset another
    # operator's password via POST /api/v1/users/{username}/password
    # (every operator can always change their own via
    # POST /api/v1/auth/password). Example:
    #   users:
    #     - {username: alice, passwordHash: "$2a$...", admin: true}
    # When empty (the default) and nothing above is set either, the chart
    # seeds one default "admin" account instead, with a random password it
    # generates once (see NOTES.txt after install/upgrade) -- so a fresh
    # `helm install` with no ui.* values still gets a real, safe login. That
    # seeded account can sign in and use the dashboard like any other, but
    # (unlike a named ui.auth.users entry) can't change its own password
    # in place -- graduate to a named ui.auth.users entry for that.
    users: []
    # existingSecret: a pre-created Secret with a users.json key (a JSON
    # array of {username, passwordHash, admin}) instead of ui.auth.users
    # above. When set, kairon-ui treats it as externally managed and never
    # writes a password change back into it -- POST /api/v1/auth/password
    # and POST /api/v1/users/{username}/password are refused (501).
    existingSecret: ""
    existingSecretKey: "users.json"
    # existingSessionSecret: a pre-created Secret holding the session-token
    # signing key, instead of the one the chart generates and persists
    # automatically. The chart-generated one is already the same single
    # Secret object every kairon-ui replica's Deployment reads from
    # (idempotent across `helm upgrade` via a `lookup`), so ui.replicaCount
    # > 1 does NOT require this -- it's only an escape hatch for an
    # externally-managed signing key.
    existingSessionSecret: ""
    existingSessionSecretKey: "sessionSecret"
  oidc:
    # "Sign in with SSO" against an external OpenID Connect identity
    # provider (Authorization Code + PKCE), alongside -- not instead of --
    # ui.auth.users/ui.token above. Off by default. Breaks this project's
    # Go-stdlib-only design guarantee deliberately (real JWT/JWK
    # verification isn't something to hand-roll) -- see README.md's "Why
    # Kairon exists" and docs/guides/kairon-ui-oidc.md.
    enabled: false
    # issuerURL: the provider's issuer, e.g. https://accounts.example.com
    # -- kairon-ui discovers the rest (authorization/token/jwks endpoints)
    # from {issuerURL}/.well-known/openid-configuration at startup, and
    # refuses to start if that fails.
    issuerURL: ""
    clientID: ""
    # clientSecret: may be left empty for a public client relying on PKCE
    # alone (a normal, common OIDC pattern) -- set clientSecret or
    # existingSecret, never both.
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: "clientSecret"
    # redirectURL: the full, externally-reachable callback URL, e.g.
    # https://kairon.example.com/api/v1/auth/oidc/callback -- must be
    # registered with the identity provider as an allowed redirect URI.
    # kairon-ui can't safely infer its own external HTTPS URL (proxies,
    # ingress hostnames vary), so this is always explicit, never guessed.
    redirectURL: ""
    # usernameClaim: which ID token claim becomes the kairon-ui session's
    # username -- the same username space ui.auth.users already occupies,
    # so audit log attribution stays consistent regardless of login
    # method. An OIDC-authenticated username is never treated as an admin
    # account (that stays exclusively a ui.auth.users[].admin: true
    # capability) -- see docs/guides/kairon-ui-oidc.md.
    usernameClaim: "email"
    scopes: "openid,profile,email"
  service:
    type: ClusterIP
    # Also the container's actual internal listen port (-listen=:port) --
    # one value drives both, since a dashboard-with-one-backend has no
    # real reason to decouple them.
    port: 8082
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
  # A single REST backend serving a small SPA -- lighter than controller/node.
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  podDisruptionBudget:
    # See controller.podDisruptionBudget above -- same reasoning, same
    # essentially-no-downside default.
    enabled: true
  networkPolicy:
    # See controller.networkPolicy above. Restricts ingress to kairon-ui's
    # service port to same-namespace pods plus allowIngressFrom -- if
    # ui.ingress is enabled and your ingress controller lives in a
    # different namespace, it needs an entry here too, or requests will be
    # silently dropped.
    enabled: false
    allowIngressFrom: []
