name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: make build
      - name: Validate manifests and repository
        run: python3 -m pip install pyyaml && python3 scripts/validate.py

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: controller
          push: false
      - name: Build node image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: node
          push: false
