version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert
    - gocritic
    - misspell
    - bodyclose
    - prealloc
    - dupl

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
